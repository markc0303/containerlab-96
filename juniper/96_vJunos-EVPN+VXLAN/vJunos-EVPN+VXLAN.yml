name: 96-vJunos-EVPN+VXLAN
prefix: ""
mgmt:
  network: custom_mgmt
  ipv4-subnet: 172.20.96.0/24

topology:
  defaults:
    env:
      CLAB_MGMT_PASSTHROUGH: "true"    
      
  nodes:
    mlag1:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.11

    mlag2:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.12
        
    spine1:
      kind: arista_ceos
      image: ceos:4.34.8M
      cpu: 1.5
      memory: 2Gb
      mgmt-ipv4: 172.20.96.20  
          
    leaf1:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.21
                
    leaf2:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.22

    leaf3:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.23
      
    leaf4:
      kind: juniper_vjunosswitch
      image: vrnetlab/vr-vjunosswitch:23.4R2-S2.1
      cpu: 4
      memory: 6Gb
      mgmt-ipv4: 172.20.96.24      
            
    vjhost1:
      kind: arista_ceos
      image: ceos:4.34.8M
      cpu: 1.5
      memory: 2Gb
      mgmt-ipv4: 172.20.96.101
      
    vjhost2:
      kind: arista_ceos
      image: ceos:4.34.8M
      cpu: 1.5
      memory: 2Gb
      mgmt-ipv4: 172.20.96.102
      
    vjhost3:
      kind: arista_ceos
      image: ceos:4.34.8M
      cpu: 1.5
      memory: 2Gb
      mgmt-ipv4: 172.20.96.103     

  links:
    - endpoints: [ "mlag1:eth1", "mlag2:eth1"]
    - endpoints: [ "mlag1:eth2", "vjhost1:eth1"]
    - endpoints: [ "mlag2:eth2", "vjhost1:eth2"]
    - endpoints: [ "mlag1:eth4", "vjhost2:eth1"]
    - endpoints: [ "mlag2:eth4", "vjhost2:eth2"]    
    
    - endpoints: [ "spine1:eth1", "leaf1:eth1"] 
    - endpoints: [ "spine1:eth2", "leaf2:eth1"]
    - endpoints: [ "spine1:eth3", "leaf3:eth1"]
    - endpoints: [ "spine1:eth4", "leaf4:eth1"]
    
    - endpoints: [ "mlag1:eth3", "leaf1:eth2"] 
    - endpoints: [ "mlag2:eth3", "leaf3:eth2"]

    - endpoints: [ "leaf2:eth2", "vjhost2:eth3"]  
    - endpoints: [ "leaf4:eth2", "vjhost2:eth4"]
    
    - endpoints: [ "leaf2:eth3", "vjhost3:eth1"]  
    - endpoints: [ "leaf4:eth3", "vjhost3:eth2"]             