version 23.4R2-S2.1;
groups {
    EVPN {
        chassis {
            aggregated-devices {
                ethernet {
                    device-count 2;
                }
            }
        }
        interfaces {
            ge-0/0/0 {
                unit 0 {
                    family inet {
                        address 10.0.12.2/24;
                    }
                }
            }
            lo0 {
                unit 0 {
                    family inet {
                        address 1.1.1.21/32;
                    }
                }
            }
            ge-0/0/1 {
                ether-options {
                    802.3ad ae0;
                }
            }
            ae0 {
                description "'mlag1'";
                esi {
                    00:11:11:11:11:11:11:11:11:11;
                    all-active;
                }
                aggregated-ether-options {
                    lacp {
                        active;
                        system-id 00:00:01:00:00:01;
                    }
                }
                unit 0 {
                    family ethernet-switching {
                        interface-mode trunk;
                        vlan {
                            members [ v10 v11 ];
                        }
                    }
                }
            }
        }
        policy-options {
            policy-statement RM-CONN-2-BGP {
                term 1 {
                    from {
                        protocol direct;
                        route-filter 1.1.1.21/32 exact;
                    }
                    then accept;
                }
            }
        }
        routing-instances {
            v10 {
                instance-type mac-vrf;
                protocols {
                    evpn {
                        encapsulation vxlan;
                    }
                }
                vtep-source-interface lo0.0;
                service-type vlan-aware;
                interface ae0.0;
                route-distinguisher 1.1.1.21:10010;
                vrf-target target:100:10010;
                vlans {
                    v10 {
                        vlan-id 10;
                        vxlan {
                            vni 10010;
                        }
                    }
                    v11 {
                        vlan-id 11;
                        vxlan {
                            vni 10011;
                        }
                    }
                }
            }
        }
        routing-options {
            router-id 1.1.1.21;
            autonomous-system 101;
        }
        protocols {
            bgp {
                group EVPN-UNDERLAY {
                    type external;
                    export RM-CONN-2-BGP;
                    neighbor 10.0.12.1 {
                        peer-as 65000;
                    }
                }
                group EVPN-OVERLAY {
                    type external;
                    traceoptions {
                        file bgp.log;
                        flag open detail;
                    }
                    multihop {
                        ttl 3;
                    }
                    local-address 1.1.1.21;
                    family evpn {
                        signaling;
                    }
                    bfd-liveness-detection {
                        minimum-interval 100;
                        multiplier 3;
                    }
                    neighbor 1.1.1.20 {
                        peer-as 65000;
                    }
                }
            }
        }
        vlans {
            v10 {
                vlan-id 10;
            }
            v11 {
                vlan-id 11;
            }
        }
    }
}
