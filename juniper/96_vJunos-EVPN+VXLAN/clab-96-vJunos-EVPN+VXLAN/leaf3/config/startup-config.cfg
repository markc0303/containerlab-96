            autonomous-system 103;
        }
        protocols {
            bgp {
                group EVPN-UNDERLAY {
                    type external;
                    export RM-CONN-2-BGP;
                    neighbor 10.0.14.1 {
                        peer-as 65000;
                    }
                }
                group EVPN-OVERLAY {
                    type external;
                    multihop {
                        ttl 3;
                    }
                    local-address 1.1.1.23;
                    family evpn {
                        signaling;
                    }
                    bfd-liveness-detection {
