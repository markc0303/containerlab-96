version 23.4R2-S2.1;
groups {
    evpn {
        chassis {
            aggregated-devices {
                ethernet {
                    device-count 2;
                }
            }
        }
        interfaces {
            ge-0/0/0 {
                unit 0 {
                    family inet {
                        address 10.1.1.1/31;
                    }
                }
            }
            ge-0/0/1 {
                unit 0 {
                    family inet {
                        address 10.2.1.1/31;
                    }
                }
            }
            lo0 {
                unit 0 {
                    family inet {
                        address 2.2.2.21/32;
                    }
                }
            }
            ge-0/0/2 {
                ether-options {
                    802.3ad ae0;
                }
            }
            ae0 {
                description " mlag1-trunk ";
                esi {
                    00:12:00:00:00:00:00:00:00:aa;
                    all-active;
                }
                aggregated-ether-options {
                    lacp {
                        active;
                        system-id 12:00:00:00:00:aa;
                    }
                }
                unit 0 {
                    family ethernet-switching {
                        interface-mode trunk;
                        vlan {
                            members [ v10 v11 ];
                        }
                    }
                }
            }
        }
        policy-options {
            policy-statement PL-LOOPBACKS {
                term 1 {
                    from {
                        protocol direct;
                        route-filter 2.2.2.0/24 prefix-length-range /32-/32;
                    }
                    then accept;
                }
            }
            policy-statement LB {
                term 1 {
                    then {
                        load-balance per-packet;
                        accept;
                    }
                }
            }
        }
        routing-instances {
            v10 {
                instance-type mac-vrf;
                protocols {
                    evpn {
                        encapsulation vxlan;
                    }
                }
                vtep-source-interface lo0.0;
                service-type vlan-aware;
                interface ae0.0;
                route-distinguisher 2.2.2.21:10;
                vrf-target target:10:10010;
                vlans {
                    v10 {
                        vlan-id 10;
                        vxlan {
                            vni 10010;
                        }
                    }
                    v11 {
                        vlan-id 11;
                        vxlan {
                            vni 10011;
                        }
                    }
                }
            }
        }
        routing-options {
            router-id 2.2.2.21;
            autonomous-system 201;
            forwarding-table {
                export LB;
            }
        }
        protocols {
            bgp {
                group EVPN-UNDERLAY {
                    type external;
                    export PL-LOOPBACKS;
                    multipath {
                        multiple-as;
                    }
                    bfd-liveness-detection {
                        minimum-interval 100;
                        multiplier 3;
                    }
                    neighbor 10.1.1.0 {
                        peer-as 65001;
                    }
                    neighbor 10.2.1.0 {
                        peer-as 65001;
                    }
                }
                group EVPN-OVERLAY {
                    type external;
                    multihop {
                        ttl 3;
                    }
                    local-address 2.2.2.21;
                    family evpn {
                        signaling;
                    }
                    multipath;
                    neighbor 1.1.1.11 {
                        peer-as 65001;
                    }
                    neighbor 1.1.1.12 {
                        peer-as 65001;
                    }
                }
            }
        }
        vlans {
            v10 {
                vlan-id 10;
            }
            v11 {
                vlan-id 11;
            }
