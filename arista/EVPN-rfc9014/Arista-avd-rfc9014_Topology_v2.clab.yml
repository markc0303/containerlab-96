---
name: avd-rfc9014
prefix: ""

mgmt:
    network: custom_mgmt
    ipv4-subnet: 172.20.96.0/24

topology:
    kinds:
        arista_ceos:
            image: ceos:4.34.8M
            cpu: 1
            memory: 2Gb
            startup-config: basic.txt
    defaults:
        kind: arista_ceos
    nodes:
        # dc1
        dc1-spine1:
            mgmt-ipv4: 172.20.96.11
        dc1-spine2:
            mgmt-ipv4: 172.20.96.12
        dc1-leaf1a:
            mgmt-ipv4: 172.20.96.101
        dc1-leaf1b:
            mgmt-ipv4: 172.20.96.102
        dc1-leaf2a:
            mgmt-ipv4: 172.20.96.103
        dc1-leaf2b:
            mgmt-ipv4: 172.20.96.104
        dc1-borderleaf1:
            mgmt-ipv4: 172.20.96.105
        dc1-leaf1c:
            mgmt-ipv4: 172.20.96.111
        dc1-leaf2c:
            mgmt-ipv4: 172.20.96.112
        dc1-leaf1-server1:
            mgmt-ipv4: 172.20.96.113
        # dc2
        dc2-spine1:
            mgmt-ipv4: 172.20.96.21
        dc2-spine2:
            mgmt-ipv4: 172.20.96.22
        dc2-leaf1a:
            mgmt-ipv4: 172.20.96.201
        dc2-leaf1b:
            mgmt-ipv4: 172.20.96.202
        dc2-leaf2a:
            mgmt-ipv4: 172.20.96.203
        dc2-leaf2b:
            mgmt-ipv4: 172.20.96.204
        dc2-borderleaf1:
            mgmt-ipv4: 172.20.96.205
        dc2-leaf1c:
            mgmt-ipv4: 172.20.96.211
        dc2-leaf2c:
            mgmt-ipv4: 172.20.96.212
        dc2-leaf1-server1:
            mgmt-ipv4: 172.20.96.114

    links:
        # dc1
        # spines to a/b leafs and border leaf
        - endpoints: ["dc1-spine1:eth1", "dc1-leaf1a:eth1"]
        - endpoints: ["dc1-spine1:eth2", "dc1-leaf1b:eth1"]
        - endpoints: ["dc1-spine1:eth3", "dc1-leaf2a:eth1"]
        - endpoints: ["dc1-spine1:eth4", "dc1-leaf2b:eth1"]
        - endpoints: ["dc1-spine1:eth5", "dc1-borderleaf1:eth1"]
        - endpoints: ["dc1-spine2:eth1", "dc1-leaf1a:eth2"]
        - endpoints: ["dc1-spine2:eth2", "dc1-leaf1b:eth2"]
        - endpoints: ["dc1-spine2:eth3", "dc1-leaf2a:eth2"]
        - endpoints: ["dc1-spine2:eth4", "dc1-leaf2b:eth2"]
        - endpoints: ["dc1-spine2:eth5", "dc1-borderleaf1:eth2"]
        # leaf a/b peer-links
        - endpoints: ["dc1-leaf1a:eth3", "dc1-leaf1b:eth3"]
        - endpoints: ["dc1-leaf1a:eth4", "dc1-leaf1b:eth4"]
        - endpoints: ["dc1-leaf2a:eth3", "dc1-leaf2b:eth3"]
        - endpoints: ["dc1-leaf2a:eth4", "dc1-leaf2b:eth4"]
        # leaf a/b to c
        - endpoints: ["dc1-leaf1a:eth8", "dc1-leaf1c:eth1"]
        - endpoints: ["dc1-leaf1b:eth8", "dc1-leaf1c:eth2"]
        - endpoints: ["dc1-leaf2a:eth8", "dc1-leaf2c:eth1"]
        - endpoints: ["dc1-leaf2b:eth8", "dc1-leaf2c:eth2"]
        # hosts
        - endpoints: ["dc1-leaf1a:eth10", "dc1-leaf1-server1:eth1"]
        - endpoints: ["dc1-leaf1b:eth10", "dc1-leaf1-server1:eth2"]
        # dc2
        # spines to a/b leafs and border leaf
        - endpoints: ["dc2-spine1:eth1", "dc2-leaf1a:eth1"]
        - endpoints: ["dc2-spine1:eth2", "dc2-leaf1b:eth1"]
        - endpoints: ["dc2-spine1:eth3", "dc2-leaf2a:eth1"]
        - endpoints: ["dc2-spine1:eth4", "dc2-leaf2b:eth1"]
        - endpoints: ["dc2-spine1:eth5", "dc2-borderleaf1:eth1"]
        - endpoints: ["dc2-spine2:eth1", "dc2-leaf1a:eth2"]
        - endpoints: ["dc2-spine2:eth2", "dc2-leaf1b:eth2"]
        - endpoints: ["dc2-spine2:eth3", "dc2-leaf2a:eth2"]
        - endpoints: ["dc2-spine2:eth4", "dc2-leaf2b:eth2"]
        - endpoints: ["dc2-spine2:eth5", "dc2-borderleaf1:eth2"]
        # leaf a/b peer-links
        - endpoints: ["dc2-leaf1a:eth3", "dc2-leaf1b:eth3"]
        - endpoints: ["dc2-leaf1a:eth4", "dc2-leaf1b:eth4"]
        - endpoints: ["dc2-leaf2a:eth3", "dc2-leaf2b:eth3"]
        - endpoints: ["dc2-leaf2a:eth4", "dc2-leaf2b:eth4"]
        # leaf a/b to c
        - endpoints: ["dc2-leaf1a:eth8", "dc2-leaf1c:eth1"]
        - endpoints: ["dc2-leaf1b:eth8", "dc2-leaf1c:eth2"]
        - endpoints: ["dc2-leaf2a:eth8", "dc2-leaf2c:eth1"]
        - endpoints: ["dc2-leaf2b:eth8", "dc2-leaf2c:eth2"]
        # hosts
        - endpoints: ["dc2-leaf2a:eth10", "dc2-leaf1-server1:eth1"]
        - endpoints: ["dc2-leaf2b:eth10", "dc2-leaf1-server1:eth2"]
        # DCI links
        - endpoints: ["dc1-borderleaf1:eth49", "dc2-borderleaf1:eth49"]
